<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fors Almaz Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Профиль пользователя -->
        <div class="user-card">
            <div class="avatar">Y</div>
            <div class="user-info">
                <h2>yahyo</h2>
                <p>ID: 8459747832</p>
            </div>
        </div>

        <!-- Баланс кошелька -->
        <div class="wallet-card">
            <span class="wallet-title">БАЛАНС КОШЕЛЬКА</span>
            <div class="wallet-balance">0.0 <span class="currency">сомони</span></div>
            <div class="wallet-buttons">
                <button class="btn-primary">Пур кардан</button>
                <button class="btn-secondary">Дастгири</button>
            </div>
        </div>

        <!-- Секция игр -->
        <div class="section-header">
            <h3>Игры и Сервисы</h3>
            <span class="badge-live">24/7 Live</span>
        </div>

        <div class="games-grid">
            <!-- Карточка Free Fire (только она) -->
            <div class="game-card">
                <div class="game-badge">GLOBAL</div>
                <div class="game-icon-container">
                    <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=100&auto=format&fit=crop&q=80" alt="Free Fire" class="game-img">
                </div>
                <div class="game-details">
                    <h4>FREE FIRE</h4>
                    <p>Алмазы и Пропуска</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
