<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fors Almaz Store</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем Telegram Web App скрипт -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Профиль пользователя -->
        <div class="user-card">
            <div class="avatar" id="user-avatar">Y</div>
            <div class="user-info">
                <h2 id="user-name">yahyo</h2>
                <p id="user-id">ID: 8459747832</p>
            </div>
        </div>

        <!-- Баланс кошелька -->
        <div class="wallet-card">
            <span class="wallet-title">БАЛАНС КОШЕЛЬКА</span>
            <div class="wallet-balance">0.0 <span class="currency">сомони</span></div>
            <div class="wallet-buttons">
                <button class="btn-primary">Пур кардан</button>
                <button class="btn-secondary">Дастгири</button>
            </div>
        </div>

        <!-- Секция товаров (Алмазы Free Fire) -->
        <div class="section-header">
            <h3>Цены на Алмазы Free Fire</h3>
            <span class="badge-live">24/7 Live</span>
        </div>

        <div class="products-grid">
            <!-- Товар 1 -->
            <div class="product-card" onclick="buyItem('100 Алмазов', '10 сомони')">
                <div class="product-icon">💎</div>
                <div class="product-info">
                    <h4>100 Алмазов</h4>
                    <p class="product-price">10 сомони</p>
                </div>
                <button class="btn-buy">Купить</button>
            </div>

            <!-- Товар 2 -->
            <div class="product-card" onclick="buyItem('310 Алмазов', '30 сомони')">
                <div class="product-icon">💎</div>
                <div class="product-info">
                    <h4>310 Алмазов</h4>
                    <p class="product-price">30 сомони</p>
                </div>
                <button class="btn-buy">Купить</button>
            </div>

            <!-- Товар 3 -->
            <div class="product-card" onclick="buyItem('520 Алмазов', '50 сомони')">
                <div class="product-icon">💎</div>
                <div class="product-info">
                    <h4>520 Алмазов</h4>
                    <p class="product-price">50 сомони</p>
                </div>
                <button class="btn-buy">Купить</button>
            </div>

            <!-- Товар 4 -->
            <div class="product-card" onclick="buyItem('Level Up Pass', '25 сомони')">
                <div class="product-icon">🎫</div>
                <div class="product-info">
                    <h4>Level Up Pass</h4>
                    <p class="product-price">25 сомони</p>
                </div>
                <button class="btn-buy">Купить</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
